<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <title>世界の震源マップ</title>
  <meta name="description" content="USGS(ANSS ComCat) の全球の震源データ（1967年〜・M2.5以上）を地球儀の上に深さ方向へ配置して立体表示するビューワ" />
  <meta name="theme-color" content="#2a78d6" />
  <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./icon-192.png" />
  <link rel="manifest" href="./manifest.webmanifest" />
</head>
<body>
  <div id="map"></div>

  <div id="toast" role="status" aria-live="polite"></div>

  <section id="panel" class="panel" aria-label="コントロールパネル">
    <header class="panel-head">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">🌏</span>
        <h1>世界の震源マップ<br /><span class="brand-sub">USGS 1967年〜・M2.5以上</span></h1>
      </div>
      <div class="head-actions">
        <button id="share-btn" class="icon-btn" type="button" title="この画面のURLをコピー" aria-label="この画面のURLをコピー">🔗</button>
        <button id="theme-btn" class="icon-btn" type="button" title="テーマ切替" aria-label="テーマ切替"></button>
        <button id="collapse-btn" class="icon-btn" type="button" title="パネル開閉" aria-label="パネル開閉"></button>
      </div>
    </header>

    <div id="panel-body" class="panel-body">
      <div class="field">
        <div class="field-head">
          <span class="field-label">レイヤー</span>
        </div>
        <div id="layers" class="toggles"></div>
      </div>

      <div class="field">
        <div class="field-head">
          <span class="field-label">震源の深さ</span>
        </div>
        <p class="depth3d-note">震源は深さ方向にも配置しています。地球儀を傾けると立体に見えます。右クリックのドラッグ、または Ctrl キーを押しながらのドラッグで傾けられます。</p>
      </div>

      <div class="field">
        <div class="field-head">
          <span class="field-label">収録データ</span>
        </div>
        <dl id="dataset-info" class="dataset-info"></dl>
      </div>
    </div>

    <footer class="panel-foot">
      震源データ: <a href="https://earthquake.usgs.gov/" target="_blank" rel="noopener">USGS Earthquake Hazards Program</a>（ANSS ComCat）<br />
      背景: <a href="https://openfreemap.org/" target="_blank" rel="noopener">OpenFreeMap</a> / OpenStreetMap contributors、衛星画像: Esri<br />
      <a href="https://github.com/shiwaku/usgs-earthquake-data-converter" target="_blank" rel="noopener">GitHub</a>
      <span id="build-ver" class="build-ver"></span>
    </footer>
  </section>

  <!-- 深さの凡例。パネルを畳んでも読めるよう地図上に出す（参考実装と同じ置き方）。 -->
  <div id="depth3d-legend" class="depth-legend" aria-hidden="true" hidden>
    <div class="dl-bar"></div>
    <div class="dl-ticks"></div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
